services:
  highscore:
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    image: unity-highscore-api:local
    restart: unless-stopped
    ports:
      - "5001:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_PATH: /app/data/highscores.sqlite
    volumes:
      - highscore_data:/app/data

volumes:
  highscore_data: