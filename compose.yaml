# Portainer: Stacks -> Add stack -> Repository
# Compose path: compose.yaml
# Builds the image directly from Dockerfile in the Git repository.
services:
  highscore:
    build:
      context: .
      dockerfile: Dockerfile
    image: unity-highscore-api:local
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_PATH: /app/data/highscores.sqlite
    volumes:
      - highscore_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:http').get('http://127.0.0.1:3000/api/high-scores', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  highscore_data:
