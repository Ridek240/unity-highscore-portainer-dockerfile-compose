
services:
  highscore:
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    image: unity-highscore-api:local
    restart: unless-stopped
    ports:
      - "5001:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_PATH: /app/data/highscores.sqlite
    volumes:
      - highscore_data:/app/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - highscore

volumes:
  highscore_data:
  caddy_data:
  caddy_config:
