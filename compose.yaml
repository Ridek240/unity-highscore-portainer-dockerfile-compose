
services:
  highscore:
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    image: unity-highscore-api:local
    restart: unless-stopped
    ports:
      - "5001:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_PATH: /app/data/highscores.sqlite
    volumes:
      - highscore_data:/app/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    command:
      - /bin/sh
      - -c
      - |
        printf '%s\n' \
          '130-61-175-88.sslip.io {' \
          '    reverse_proxy highscore:3000' \
          '}' > /etc/caddy/Caddyfile
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - highscore

volumes:
  highscore_data:
  caddy_data:
  caddy_config:
